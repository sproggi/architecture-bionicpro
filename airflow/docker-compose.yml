version: '3.8'

services:
  airflow_db:
    image: postgres:14
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ./data/airflow-postgres:/var/lib/postgresql/data

  airflow:
    build: .
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_password@airflow_db:5432/airflow
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      PG_HOST: telemetry_db
      PG_PORT: "5432"
      PG_DB: telemetry
      PG_USER: telemetry
      PG_PASSWORD: telemetry_password
      CH_HOST: clickhouse
      CH_PORT: "9000"
      CH_USER: reports
      CH_PASSWORD: reports_password
      BITRIX24_BASE_URL: http://crm:8090
      BITRIX24_AUTH_TOKEN: demo-token
    command: airflow standalone
    ports:
      - "8099:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
    depends_on:
      airflow_db:
        condition: service_healthy
      telemetry_db:
        condition: service_started
      clickhouse:
        condition: service_started
      crm:
        condition: service_started

  telemetry_db:
    image: postgres:14
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetry"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ./data/telemetry-postgres:/var/lib/postgresql/data
      - ./init/telemetry.sql:/docker-entrypoint-initdb.d/telemetry.sql:ro
    ports:
      - "5434:5432"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: reports
      CLICKHOUSE_USER: reports
      CLICKHOUSE_PASSWORD: reports_password
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./init/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "8123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  crm:
    image: python:3.11-slim
    command: python -u /app/mock_crm.py
    volumes:
      - ./mock_crm.py:/app/mock_crm.py:ro

  api:
    build: ../api
    ports:
      - "8000:8000"
    networks:
      - default
      - bionicpro
    environment:
      CH_HOST: clickhouse
      CH_PORT: "9000"
      CH_USER: reports
      CH_PASSWORD: reports_password
      CH_DB: reports
      REQUIRE_AUTH: "true"
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: reports-realm
      REQUIRED_ROLE: prothetic_user
      FRONTEND_ORIGIN: http://localhost:3000
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  clickhouse_data:

networks:
  bionicpro:
    external: true
    name: bionicpro
